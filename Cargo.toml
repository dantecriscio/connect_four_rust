[package]
name = "connect_four_rust"
version = "0.1.0"
edition = "2024"
# So that `cargo run --release` starts the server
default-run = "web-server"

# TODO: Split the library and application stuff into separate workspaces
# Then make thiserror a library dependency but anyhow an application dependency
[dependencies]
thiserror = "2"
anyhow = "1.0"
rayon = "1.12.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }
axum = "0.8.9"
tower-http = { version = "0.7.1", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }

[profile.profiling]
inherits = "release"
debug = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "solver"
path = "src/bin/solver.rs"

[[bin]]
name = "book-maker"
path = "src/bin/book_maker.rs"

[[bin]]
name = "web-server"
path = "src/bin/web_server.rs"
