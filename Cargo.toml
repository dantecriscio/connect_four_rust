[package]
name = "connect_four_rust"
version = "0.1.0"
edition = "2024"

# TODO: Split the library and application stuff into separate workspaces
# Then make thiserror a library dependency but anyhow an application dependency
[dependencies]
thiserror = "2"
anyhow = "1.0"
rayon = "1.12.0"

[profile.profiling]
inherits = "release"
debug = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "solver"
path = "src/bin/solver.rs"

[[bin]]
name = "book-maker"
path = "src/bin/book_maker.rs"
